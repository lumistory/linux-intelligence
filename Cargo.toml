[workspace]
resolver = "3"
members = [
    "crates/li-proto",
    "crates/li-journal",
    "crates/li-hook",
    "crates/li-daemon",
    "crates/li-cli",
]
# Phase 0 experiments are standalone Cargo packages with their own lockfiles.
# Excluding them keeps `experiments/00-h-correlation` buildable on its own after
# this workspace root appears above it (otherwise cargo refuses the nested
# package with "believes it's in a workspace when it's not").
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, not 1.85: edition 2024 alone needs 1.85, but `li-proto` uses `let`
# chains (`if let ... && cond`), which stabilised for edition 2024 in 1.88.
# Only rustc 1.99.0 has actually been built against; this is a floor derived
# from the language features in use, not a tested-minimum claim.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
# Phase 1 needs no unsafe anywhere (ADR 0001, spec §1). If that ever changes it
# is a reviewed decision, not a local `#[allow]`.
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
