[package]
name = "li-observer-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Phase 0 experiment 0-E: procfs polling and inotify capability probes"

[dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false, features = [
    "process",
    "fs",
    "poll",
    "signal",
    "socket",
    "resource",
    "user",
    "time",
] }
thiserror = "2"

[profile.release]
debug = false
panic = "abort"

[profile.dev]
debug = 1

[[bin]]
name = "proc_observer"
path = "src/bin/proc_observer.rs"

[[bin]]
name = "fs_observer"
path = "src/bin/fs_observer.rs"
