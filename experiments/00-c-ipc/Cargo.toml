[package]
name = "li-ipc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.191"
thiserror = "2.0.21"
uuid = { version = "1.29", features = ["v4"] }

[profile.release]
debug = 1
