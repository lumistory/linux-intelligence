[package]
name = "li-privhelper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.29", features = ["v4"] }

[lib]
name = "li_privhelper"
path = "src/lib.rs"

[[bin]]
name = "helper"
path = "src/bin/helper.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "credprobe"
path = "src/bin/credprobe.rs"

[profile.release]
debug = 1
overflow-checks = true
