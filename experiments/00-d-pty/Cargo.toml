[package]
name = "li-pty-proto"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "li-pty-proto"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "time", "term", "poll", "ioctl"] }
serde_json = "1"
thiserror = "2"

[profile.release]
debug = false
panic = "abort"
