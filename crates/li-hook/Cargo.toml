[package]
name = "li-hook"
description = "Tiny, no-Tokio client binary invoked from shell adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# P1-10 resolved: Cargo forbids package-level `panic = "abort"` overrides.
# `li-hook` stays unwind-safe with no panic-on-input paths (`unwrap` avoided in
# runtime code) instead of forcing workspace-wide `[profile.release] panic = "abort"`.
# See `shell/README.md`.

[dependencies]
li-proto = { path = "../li-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "^1", features = ["net"] }

[lints]
workspace = true
